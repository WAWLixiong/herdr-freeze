[package]
name = "herdr-freeze"
version = "0.1.0"
description = "Herdr plugin: auto-freeze idle pane process trees to release memory, with a click-to-thaw tab overlay."
edition = "2021"

[[bin]]
name = "herdr-freeze"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2.4.2"

# No windows-sys / libc dependency: platform FFI (NtSuspendProcess / kill) is
# declared inline in src/freezer.rs, mirroring the work-assistant freezer.

[profile.release]
opt-level = 2
